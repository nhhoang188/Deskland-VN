<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · Boxing xả stress</title>
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #262c34; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: pointer; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(20,35,45,.32); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.78); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ghosts"></div>
<script>
'use strict';

const TASKBAR = 48;
const QS = new URLSearchParams(location.search);
const PREVIEW = QS.has('preview');
if (PREVIEW) document.body.classList.add('preview');

const DEFAULTS = { bounciness: 1.2, punchPower: 1.0, gloveStyle: 0, backdrop: 0, autoPunch: 0 };
const P = Object.assign({}, DEFAULTS);

const cv = document.getElementById('art');
const ctx = cv.getContext('2d', { alpha: false });
let W = innerWidth, H = innerHeight, S = 1;
let paused = false, lastT = 0, animT = 0;

function mkSpring() { return { pos: 0, vel: 0 }; }
function stepSpring(sp, dt, omega, zeta, lim) {
  const h = dt / 3;
  for (let i = 0; i < 3; i++) {
    sp.vel += (-omega * omega * sp.pos - 2 * zeta * omega * sp.vel) * h;
    sp.pos += sp.vel * h;
  }
  if (sp.pos > lim) { sp.pos = lim; sp.vel *= -0.35; }
  if (sp.pos < -lim) { sp.pos = -lim; sp.vel *= -0.35; }
}

const headX = mkSpring(), headY = mkSpring(), headRot = mkSpring(), headSq = mkSpring();
const glassRot = mkSpring(), glassY = mkSpring(), torsoX = mkSpring(), torsoSq = mkSpring();
const necklace = mkSpring();
let mugY = 0, mugVy = 0, wince = 0, dizzy = 0, combo = 0, lastGap = 99, autoCd = 0.6;
const punches = [], puffs = [];

function anchors() {
  const availH = Math.max(240, H - TASKBAR);
  const deskY = availH * 0.80;
  const cx = W * 0.5;
  return { deskY, cx, headY0: deskY - 252 * S, torsoY0: deskY - 88 * S };
}

function launchPunch(x, y) {
  const { deskY, cx, headY0, torsoY0 } = anchors();
  const hx = (x - (cx + headX.pos * S)) / S;
  const hy = (y - (headY0 + headY.pos * S)) / S;
  let zone = 'belly', tx = cx, ty = torsoY0, ox = cx - 200 * S, oy = torsoY0;
  if (hy < -42) {
    zone = 'top'; tx = cx + Math.max(-40, Math.min(40, hx)) * S; ty = headY0 - 68 * S; ox = tx; oy = ty - 220 * S;
  } else if (hy < 85) {
    if (hx < -25) { zone = 'left'; tx = cx - 68 * S; ty = headY0 + 10 * S; ox = tx - 230 * S; oy = ty + 25 * S; }
    else if (hx > 25) { zone = 'right'; tx = cx + 68 * S; ty = headY0 + 10 * S; ox = tx + 230 * S; oy = ty + 25 * S; }
    else { zone = 'nose'; tx = cx; ty = headY0 + 10 * S; ox = cx + 60 * S; oy = ty + 160 * S; }
  } else {
    tx = cx + Math.max(-85, Math.min(85, hx)) * S; ty = torsoY0;
    ox = tx + (hx < 0 ? -220 : 220) * S; oy = ty + 30 * S;
  }
  punches.push({ zone, ox, oy, tx, ty, dir: Math.atan2(ty - oy, tx - ox), age: 0, hit: false });
  if (punches.length > 4) punches.shift();
}

function hitImpact(p) {
  const b = P.bounciness, pw = P.punchPower;
  puffs.push({ x: p.tx, y: p.ty, age: 0 });
  if (puffs.length > 6) puffs.shift();
  combo = lastGap < 0.8 ? combo + 1 : 1;
  lastGap = 0;
  wince = 0.42;
  if (combo >= 4) dizzy = 1.3;
  if (p.zone === 'top') {
    headSq.vel -= 8.8 * b; headY.vel += 600 * pw; torsoSq.vel -= 4 * b; glassY.vel += 240 * b; mugVy = 180 * pw;
  } else if (p.zone === 'left') {
    headX.vel += 640 * pw; headRot.vel += 7.5 * b; glassRot.vel += 11.5 * b; headSq.vel -= 2.8 * b; necklace.vel += 10 * pw;
  } else if (p.zone === 'right') {
    headX.vel -= 640 * pw; headRot.vel -= 7.5 * b; glassRot.vel -= 11.5 * b; headSq.vel -= 2.8 * b; necklace.vel -= 10 * pw;
  } else if (p.zone === 'nose') {
    headSq.vel -= 6.5 * b; headY.vel -= 220 * pw; glassRot.vel += (Math.random() - 0.5) * 20 * b;
  } else {
    torsoSq.vel -= 5.8 * b; torsoX.vel += (p.ox < p.tx ? 260 : -260) * pw; headY.vel += 320 * pw; mugVy = 220 * pw;
  }
}

cv.addEventListener('pointerdown', e => launchPunch(e.clientX, e.clientY));

function step(dt) {
  animT += dt; lastGap += dt;
  if (P.autoPunch > 0) {
    autoCd -= dt;
    if (autoCd <= 0) {
      const { cx, headY0 } = anchors();
      const r = Math.random();
      launchPunch(cx + (r < 0.4 ? 0 : (r < 0.7 ? -80 * S : 80 * S)), headY0 + (r < 0.4 ? -75 * S : 10 * S));
      autoCd = P.autoPunch >= 2 ? 0.42 : 1.35;
    }
  }
  for (let i = punches.length - 1; i >= 0; i--) {
    const p = punches[i]; p.age += dt;
    if (!p.hit && p.age >= 0.075) { p.hit = true; hitImpact(p); }
    if (p.age >= 0.36) punches.splice(i, 1);
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    puffs[i].age += dt * 1.65;
    if (puffs[i].age >= 1) puffs.splice(i, 1);
  }
  const z = Math.max(0.14, Math.min(0.42, 0.30 / Math.sqrt(P.bounciness)));
  stepSpring(headX, dt, 21, z, 60); stepSpring(headY, dt, 23, z, 55);
  stepSpring(headRot, dt, 19.5, z, 0.48); stepSpring(headSq, dt, 25, z, 0.50);
  stepSpring(glassRot, dt, 15.5, z * 0.72, 0.44); stepSpring(glassY, dt, 17, z * 0.72, 22);
  stepSpring(torsoX, dt, 20, z, 38); stepSpring(torsoSq, dt, 23, z, 0.36);
  stepSpring(necklace, dt, 13.5, 0.12, 0.85);
  if (mugY > 0 || mugVy !== 0) {
    mugY += mugVy * dt; mugVy -= 680 * dt;
    if (mugY <= 0) { mugY = 0; mugVy = mugVy < -45 ? -mugVy * 0.42 : 0; }
  }
  wince = Math.max(0, wince - dt); dizzy = Math.max(0, dizzy - dt);
}

function draw() {
  const { deskY, cx, headY0, torsoY0 } = anchors();
  const mode = Math.round(P.backdrop);
  ctx.fillStyle = mode === 2 ? '#1a2234' : mode === 1 ? '#413d65' : '#3d454f';
  ctx.fillRect(0, 0, W, H);
  if (mode === 1) {
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    for (let i = 0; i < 10; i++) {
      ctx.beginPath();
      ctx.arc(cx + (i % 2 ? 1 : -1) * (160 + i * 32) * S, deskY - ((i * 45 + animT * 20) % 260) * S, (20 + (i % 3) * 12) * S, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Chair
  ctx.fillStyle = '#292d36'; ctx.strokeStyle = '#1d191d'; ctx.lineWidth = 2.6 * S;
  ctx.beginPath(); ctx.roundRect(cx - 122 * S, deskY - 235 * S, 244 * S, 215 * S, 44 * S); ctx.fill(); ctx.stroke();

  // Torso
  ctx.save();
  ctx.translate(cx + torsoX.pos * S, deskY);
  const tSy = Math.exp(torsoSq.pos), tSx = Math.exp(-torsoSq.pos * 0.82);
  ctx.scale(tSx, tSy);
  ctx.fillStyle = '#f8cdb6';
  ctx.beginPath(); ctx.roundRect(-114 * S, -105 * S, 36 * S, 105 * S, 18 * S); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(78 * S, -105 * S, 36 * S, 105 * S, 18 * S); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1e2128';
  ctx.beginPath(); ctx.roundRect(-94 * S, -162 * S, 188 * S, 165 * S, 42 * S); ctx.fill(); ctx.stroke();
  // Silver necklace
  const nx = Math.sin(necklace.pos) * 36 * S, ny = -145 * S + Math.cos(necklace.pos) * 46 * S;
  ctx.strokeStyle = '#e4e9f2'; ctx.lineWidth = 1.6 * S;
  ctx.beginPath(); ctx.moveTo(-30 * S, -148 * S); ctx.lineTo(nx, ny); ctx.lineTo(30 * S, -148 * S); ctx.stroke();
  ctx.fillStyle = '#52c7d6'; ctx.beginPath(); ctx.arc(nx, ny + 5 * S, 5 * S, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Chibi Head (Squash & Stretch)
  ctx.save();
  const bob = Math.sin(animT * 2.1) * 2 * S;
  ctx.translate(cx + headX.pos * S, headY0 + headY.pos * S + bob + 82 * S);
  ctx.rotate(headRot.pos);
  const hSy = Math.exp(headSq.pos), hSx = Math.exp(-headSq.pos * 0.86);
  ctx.scale(hSx, hSy);
  ctx.translate(0, -82 * S);

  // Back hair & face
  ctx.fillStyle = '#422619'; ctx.strokeStyle = '#1d191d'; ctx.lineWidth = 2.8 * S;
  ctx.beginPath(); ctx.ellipse(0, -8 * S, 104 * S, 96 * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f9d0ba';
  ctx.beginPath(); ctx.ellipse(0, 4 * S, 96 * S, 88 * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // Blush
  ctx.fillStyle = 'rgba(246,130,144,0.52)';
  ctx.beginPath(); ctx.ellipse(-56 * S, 24 * S, 20 * S, 12 * S, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( 56 * S, 24 * S, 20 * S, 12 * S, 0, 0, Math.PI * 2); ctx.fill();

  // Eyes
  [-39, 39].forEach((ex, idx) => {
    if (wince > 0.05) {
      ctx.strokeStyle = '#1d191d'; ctx.lineWidth = 3 * S;
      const sg = idx === 0 ? 1 : -1;
      ctx.beginPath(); ctx.moveTo((ex - 11 * sg) * S, -9 * S); ctx.lineTo((ex + 9 * sg) * S, 0); ctx.lineTo((ex - 11 * sg) * S, 9 * S); ctx.stroke();
    } else {
      ctx.fillStyle = '#261611';
      ctx.beginPath(); ctx.arc(ex * S, -1 * S, 12.5 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc((ex - 4) * S, -5 * S, 4 * S, 0, Math.PI * 2); ctx.fill();
    }
  });

  // Big cheerful toothy smile
  ctx.fillStyle = '#9e2e3d'; ctx.strokeStyle = '#d44d5c'; ctx.lineWidth = 3.5 * S;
  ctx.beginPath(); ctx.arc(0, 36 * S, 32 * S, 0.08 * Math.PI, 0.92 * Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-26 * S, 39 * S, 52 * S, 8.5 * S);

  // Wispy bangs + Pearl hair clip
  ctx.fillStyle = '#603a27';
  ctx.beginPath(); ctx.ellipse(0, -68 * S, 88 * S, 30 * S, 0, Math.PI, Math.PI * 2); ctx.fill();
  for (let b = -2; b <= 2; b++) {
    ctx.beginPath(); ctx.moveTo(b * 16 * S, -72 * S); ctx.quadraticCurveTo(b * 21 * S, -45 * S, b * 20 * S, -22 * S);
    ctx.lineWidth = 5 * S; ctx.strokeStyle = '#603a27'; ctx.stroke();
  }
  ctx.save(); ctx.translate(-75 * S, -55 * S); ctx.rotate(-0.6);
  ctx.fillStyle = '#fffdf8'; ctx.strokeStyle = '#1d191d'; ctx.lineWidth = 1.8 * S;
  ctx.beginPath(); ctx.roundRect(-16 * S, -5 * S, 32 * S, 10 * S, 5 * S); ctx.fill(); ctx.stroke();
  ctx.restore();

  // Browline Glasses
  ctx.save(); ctx.translate(0, glassY.pos * S); ctx.rotate(glassRot.pos);
  [-41, 41].forEach(gx => {
    ctx.strokeStyle = '#cfd6e0'; ctx.lineWidth = 1.8 * S;
    ctx.beginPath(); ctx.roundRect((gx - 29) * S, -24 * S, 58 * S, 46 * S, 20 * S); ctx.stroke();
    ctx.strokeStyle = '#181920'; ctx.lineWidth = 4.2 * S;
    ctx.beginPath(); ctx.arc(gx * S, -3 * S, 28 * S, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  });
  ctx.strokeStyle = '#cfd6e0'; ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.moveTo(-12 * S, -6 * S); ctx.lineTo(12 * S, -6 * S); ctx.stroke();
  ctx.restore();

  ctx.restore();

  // Wooden Desk & Watermelon Mug
  ctx.fillStyle = mode === 1 ? '#f2f2f0' : '#d5b798';
  ctx.fillRect(0, deskY, W, H - deskY);
  const mx = cx + 245 * S, my = deskY - 26 * S - mugY * S;
  ctx.fillStyle = '#8bc632'; ctx.strokeStyle = '#1d191d'; ctx.lineWidth = 2.2 * S;
  ctx.beginPath(); ctx.roundRect(mx - 26 * S, my - 24 * S, 52 * S, 50 * S, 7 * S); ctx.fill(); ctx.stroke();

  // Puffs
  for (const pf of puffs) {
    const a = 1 - pf.age;
    ctx.fillStyle = `rgba(255,255,255,${a * 0.75})`;
    for (let k = 0; k < 6; k++) {
      const ang = k * 1.047;
      ctx.beginPath(); ctx.arc(pf.x + Math.cos(ang) * pf.age * 65 * S, pf.y + Math.sin(ang) * pf.age * 65 * S, (16 - pf.age * 10) * S, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Gloves
  for (const g of punches) {
    const u = g.age < 0.08 ? g.age / 0.08 : Math.max(0, 1 - (g.age - 0.08) / 0.28);
    const gx = g.ox + (g.tx - g.ox) * u, gy = g.oy + (g.ty - g.oy) * u;
    ctx.save(); ctx.translate(gx, gy); ctx.rotate(g.dir);
    ctx.globalAlpha = Math.min(1, u * 1.4);
    const st = Math.round(P.gloveStyle);
    ctx.fillStyle = st === 1 ? '#fca973' : st === 2 ? '#fff9f7' : '#e63038';
    ctx.strokeStyle = '#1d191d'; ctx.lineWidth = 2.6 * S;
    ctx.beginPath(); ctx.roundRect(-36 * S, -30 * S, 70 * S, 60 * S, 24 * S); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; S = Math.max(0.45, Math.min(W, H) / 900);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
addEventListener('resize', resize);
resize();

function loop(ts) {
  requestAnimationFrame(loop);
  if (paused) { lastT = ts; return; }
  const dt = Math.min(0.05, ((ts - (lastT || ts)) / 1000) || 0.016);
  lastT = ts;
  step(dt);
  draw();
}
requestAnimationFrame(loop);

addEventListener('message', e => {
  const m = e.data || {};
  if (m.t === 'settings' && m.params) Object.assign(P, m.params);
  else if (m.t === 'reset') Object.assign(P, DEFAULTS);
  else if (m.t === 'pause') paused = !!m.v;
});
if (parent !== window) parent.postMessage({ t: 'ready', theme: 'gymo-boxing' }, '*');
</script>
</body>
</html>
